<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Checkout - Kirat Bakers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-dark text-white text-center py-3">
            <h3>Final Checkout</h3>
        </div>
        <div class="card-body p-4">
            
            <div class="alert alert-info d-flex justify-content-between">
                <span>Total Amount to Pay:</span>
                <span class="fw-bold fs-5">$<span th:text="${total}">0.00</span></span>
            </div>

            <form th:action="@{/checkout}" th:object="${orderRequest}" method="post" onsubmit="handleCheckout()">
                
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="e.g. John Doe" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number (CA)</label>
                    <div class="input-group">
                        <span class="input-group-text">🇨🇦 +1</span>
                        <input type="tel" th:field="*{phoneNumber}" class="form-control" 
                               placeholder="(555) 123-4567" pattern="[0-9\s\-\(\)]+" required>
                    </div>
                    <small class="text-muted">Enter 10-digit number</small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Delivery Address</label>
                    <textarea th:field="*{address}" class="form-control" rows="3" placeholder="Apartment, Street, City..." required></textarea>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success btn-lg">
                        Confirm & Download Bill 📄
                    </button>
                    <a th:href="@{/cart}" class="btn btn-outline-secondary">Back to Cart</a>
                </div>

            </form>
        </div>
    </div>
</div>
<script>
    function handleCheckout() {
        // The form submits immediately to start the download...
        
        // We wait 2 seconds (2000ms) to ensure the download request is sent,
        // then we redirect the user to the Home Page.
        setTimeout(function() {
            window.location.href = "/";
        }, 2000);
    }
</script>
</body>
</html>
