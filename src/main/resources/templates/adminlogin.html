<html>
    <head>
        <title>Admin Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Google Fonts (optional) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
        <style>
            .bg-image-vertical {
position: relative;
overflow: hidden;
background-repeat: no-repeat;
background-position: right center;
background-size: auto 100%;
}
.loginbtn{
    background-color: #8f654d;
    color: white;
}

@media (min-width: 1025px) {
.h-custom-2 {
height: 100%;
}
}
            
        </style>
        
    </head>
    <body>
        <!-- Toast Container -->
<div class="toast-container position-fixed top-0 end-0 p-3">

    <div id="errorToast"
         class="toast align-items-center text-bg-danger border-0"
         role="alert"
         aria-live="assertive"
         aria-atomic="true"
         th:if="${error}">

        <div class="d-flex">
            <div class="toast-body">
                <strong>Error:</strong>
                <span th:text="${error}"></span>
            </div>
            <button type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast">
            </button>
        </div>

    </div>
</div>

        <section class="vh-100">
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-6 text-black">

        <div class="px-5 ms-xl-4">
          <img src="images/main_logo.png" style="height: 200px; width:200px "/>
          
        </div>

        <div class="d-flex align-items-center h-custom-2 px-5 ms-xl-4 mt-5 pt-5 pt-xl-0 mt-xl-n5">

          <form method="post" action="/adminlogin" style="width: 23rem;">

    <h3 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px;">Log in</h3>

    <div class="form-outline mb-4">
        <input type="text"
               name="name"
               class="form-control form-control-lg"
               required />
        <label class="form-label">Username</label>
    </div>

    <div class="form-outline mb-4">
        <input type="password"
               name="password"
               class="form-control form-control-lg"
               required />
        <label class="form-label">Password</label>
    </div>

    <div class="pt-1 mb-4">
        <button class="loginbtn btn  btn-lg btn-block" type="submit">
            Login
        </button>
    </div>
<p class="small mb-5 pb-lg-2"><a class="text-muted" href="#!">Forgot password?</a></p>

</form>

        </div>

      </div>
      <div class="col-sm-6 px-0 d-none d-sm-block">
        <img src="images/cake_admin.jpg"
          alt="Login image" class="w-100 vh-100" style="object-fit: cover; object-position: left;">
      </div>
    </div>
  </div>
</section>
        <script>
    document.addEventListener("DOMContentLoaded", function () {
        let toastEl = document.getElementById("errorToast");
        if (toastEl) {
            let toast = new bootstrap.Toast(toastEl, {
                delay: 3000   // 3 seconds
            });
            toast.show();
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
