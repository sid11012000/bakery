<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Admin Dashboard</span>
        <div>
            <button class="btn btn-sm btn-outline-secondary"
        onclick="window.location.href='/admin/items'">
                Add New Cake Item</button>
            <a th:href="@{/logout}" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Customer Orders (Latest First)</h2>
    
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-dark">
                    <tr>
        <th>ID</th> <th>Date</th>
        <th>Customer</th>
        <th>Address</th>
        <th>Items Ordered</th>
        <th>Total</th>
    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td class="fw-bold" th:text="'#' + ${order.id}">#1</td>
                        <td th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}">Date</td>
                        
                        <td>
                            <div class="fw-bold" th:text="${order.customerName}">Name</div>
                            <small class="text-muted" th:text="${order.phoneNumber}">Phone</small>
                        </td>
                        
                        <td th:text="${order.address}" style="max-width: 200px;">Address</td>
                        
                        <td>
    <ul class="mb-0 ps-3 small">
        <li th:each="itemStr : ${#strings.arraySplit(order.orderDescription, ',')}" 
            class="mb-1"
            th:if="${!#strings.isEmpty(itemStr)}"> <span th:text="${#strings.replace(#strings.replace(#strings.trim(itemStr), '(', ' '), ')', '')}">
                Chocolate Cake 2
            </span>
            
        </li>
    </ul>
</td>
                        
                        <td class="fw-bold text-success" th:text="'$' + ${order.totalAmount}">$50.00</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
