<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Items</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff1f7 0%, #ffe5d9 50%, #fff7e6 100%);
            min-height: 100vh;
        }

        .navbar {
            background: #8f654d;
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .navbar-text {
            font-size: 0.95rem;
        }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <span class="me-2 fs-4">🎂</span>
            <span>KIRAT BAKERS ADMIN</span>
        </a>

        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="navbar-text text-white-50 d-none d-md-inline">
                Welcome, <span class="fw-semibold"><span th:text="${adminName}"></span></span> 👋
            </span>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>All Items</h4>

    <div class="d-flex gap-2">
        <a th:href="@{/admin/items/add}" class="btn btn-primary">
            ➕ Add Item
        </a>

        <a th:href="@{/admin/categories}" class="btn btn-outline-primary">
            🗂 Manage Categories
        </a>
    </div>
</div>
    <form th:action="@{/admin/items}" method="get" class="mb-3">
    <div class="input-group">
        <input type="text"
               name="keyword"
               class="form-control"
               placeholder="Search by category, subcategory or item name"
               th:value="${keyword}">
        <button class="btn btn-outline-primary" type="submit">
            Search
        </button>
        <a th:href="@{/admin/items}" class="btn btn-outline-secondary">
            Clear
        </a>
    </div>
</form>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>Category</th>
            <th>Sub Category</th>
            <th>Item Name</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${items}">
            <td th:text="${i.category.name}"></td>
<td th:text="${i.subCategory != null ? i.subCategory.name : '-'}"></td>
            <td th:text="${i.itemName}"></td>
            <td>
                <a th:href="@{/admin/items/edit/{id}(id=${i.id})}"
                   class="btn btn-sm btn-warning">Edit</a>

                <a th:href="@{/admin/items/delete/{id}(id=${i.id})}"
                   onclick="return confirm('Delete this item?')"
                   class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/adminhome}" class="btn btn-secondary mt-3">Back</a>
</div>

</body>
</html>
