<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Categories</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff1f7 0%, #ffe5d9 50%, #fff7e6 100%);
            min-height: 100vh;
        }
        .card {
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

<div class="container mt-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-semibold">🗂 Manage Categories</h4>
        <a th:href="@{/admin/items}" class="btn btn-outline-secondary">
            ⬅ Back to Items
        </a>
    </div>

    <div class="row g-4">

        <!-- ADD CATEGORY -->
        <div class="col-md-6">
            <div class="card p-4">
                <h6 class="mb-3 fw-semibold">Add Category</h6>
                <form th:action="@{/admin/categories/save-category}" method="post">
                    <input class="form-control mb-3"
                           name="name"
                           placeholder="Category name (Cake / Biscuit)"
                           required>
                    <button class="btn btn-primary w-100">
                        ➕ Add Category
                    </button>
                </form>
            </div>
        </div>

        <!-- ADD SUB CATEGORY -->
        <div class="col-md-6">
            <div class="card p-4">
                <h6 class="mb-3 fw-semibold">Add Sub Category</h6>
                <form th:action="@{/admin/categories/save-subcategory}" method="post">
                    <select name="categoryId" class="form-select mb-3" required>
                        <option value="">-- Select Category --</option>
                        <option th:each="c:${categories}"
                                th:value="${c.id}"
                                th:text="${c.name}">
                        </option>
                    </select>

                    <input class="form-control mb-3"
                           name="name"
                           placeholder="Subcategory name (Cheesecake / Tea Cake)">

                    <button class="btn btn-success w-100">
                        ➕ Add Subcategory
                    </button>
                </form>
            </div>
        </div>

        <!-- CATEGORY LIST -->
        <div class="col-12">
            <div class="card p-4">
                <h6 class="mb-3 fw-semibold">Existing Categories</h6>

                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Category</th>
                        <th>Sub Categories</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
<tr th:each="c : ${categories}">
    <td class="fw-semibold" th:text="${c.name}"></td>

    <td th:with="hasSub=false">
        <!-- List subcategories -->
        <span th:each="sc : ${subCategories}"
              th:if="${sc.category.id == c.id}"
              th:text="${sc.name}"
              class="badge bg-secondary me-1 mb-1"
              th:with="hasSub=true">
        </span>

        <!-- If none found -->
        <span th:if="${!hasSub}" class="text-muted small">
            No subcategories
        </span>
    </td>
    <!-- DELETE BUTTON -->
    <td>
        <a th:href="@{/admin/categories/delete-category/{id}(id=${c.id})}"
           onclick="return confirm('Are you sure you want to delete this category? All its subcategories will also be deleted.')"
           class="btn btn-sm btn-danger">
           🗑 Delete
        </a>
    </td>
</tr>
</tbody>

                </table>
            </div>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
