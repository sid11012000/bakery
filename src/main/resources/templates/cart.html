<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">← Back to Menu</a>
        <span class="fw-bold">Your Cart (<span th:text="${cartCount}">0</span>)</span>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Shopping Cart</h2>

    <div class="row">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Product</th>
                                <th>Price</th>
                                <th>Qty</th>
                                <th>Total</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item, iStat : ${cart}">
                                <td>
                                    <img th:if="${item.imageName != null and item.imageName != ''}" 
             th:src="@{'/images/' + ${item.imageName}}" 
             class="rounded me-3 shadow-sm" 
             style="width: 50px; height: 50px; object-fit: cover;">
                                </td>
                                <td th:text="'$' + ${item.price}">$10</td>
                                <td th:text="${item.quantity}">1</td> 
                                <td class="fw-bold text-success" th:text="'$' + ${item.total}"></td>
                                <td>
                                    <a th:href="@{'/cart/removeItem/' + ${iStat.index}}" class="text-danger">
                                        ❌
                                    </a>
                                </td>
                            </tr>
                            
                            <tr th:if="${cart.isEmpty()}">
                                <td colspan="5" class="text-center py-4 text-muted">
                                    Your cart is empty. <a th:href="@{/}">Go add some cakes!</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-bold">Order Summary</div>
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span class="fw-bold">$<span th:text="${total}">0.00</span></span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span>Tax (5%)</span>
                        <span>$0.00</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fs-5 fw-bold">Total</span>
                        <span class="fs-5 fw-bold text-primary">$<span th:text="${total}">0.00</span></span>
                    </div>
                    <a th:href="@{/checkout}" class="btn btn-dark w-100 py-2">Proceed to Checkout</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
