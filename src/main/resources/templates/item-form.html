<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add / Edit Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h4>Add / Edit Item</h4>

    <form th:action="@{/admin/items/save}" 
      th:object="${item}" 
      method="post" 
      enctype="multipart/form-data">

        <!--<input type="hidden" th:field="*{id}"/>-->
        <input type="hidden" name="id" th:value="${item.id}">


        <!-- CATEGORY -->
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select"
        name="categoryId"
        id="categorySelect"
        onchange="loadSubCategories(this.value)"
        required>

    <option value="">-- Select Category --</option>

    <option th:each="c : ${categories}"
            th:value="${c.id}"
            th:text="${c.name}"
            th:selected="${item.category != null && item.category.id == c.id}">
    </option>
</select>


        </div>

        <!-- SUB CATEGORY -->
        <div class="mb-3" id="subDiv">
    <label class="form-label">Sub Category</label>
    <select class="form-select"
        name="subCategoryId"
        id="subCategorySelect"
        th:attr="data-selected=${item.subCategory != null ? item.subCategory.id : ''}">
    <option value="">-- Select Sub Category --</option>
</select>



</div>

        <!-- ITEM NAME -->
        <div class="mb-3">
            <label class="form-label">Item Name</label>
            <input type="text"
                   class="form-control"
                   th:field="*{itemName}"
                   required>
        </div>
        <div class="mb-3">
        <label class="form-label">Item Image</label>
        <input type="file" name="imageFile" class="form-control" accept="image/*">
        
        <div th:if="${item.imageName != null}" class="mt-2 text-muted">
            Current: <span th:text="${item.imageName}"></span>
        </div>
    </div>

        <button class="btn btn-success">Save</button>
        <a th:href="@{/admin/items}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script>
function loadSubCategories(categoryId) {

    const subDiv = document.getElementById("subDiv");
    const subSelect = document.getElementById("subCategorySelect");
    const selectedSubId = subSelect.dataset.selected;

    subSelect.innerHTML = '<option value="">-- Select Sub Category --</option>';

    if (!categoryId) {
        subDiv.style.display = "none";
        return;
    }

    fetch('/admin/items/subcategories/' + categoryId)
        .then(res => res.json())
        .then(data => {

            if (data.length === 0) {
                subDiv.style.display = "none";
            } else {
                subDiv.style.display = "block";

                data.forEach(sc => {
                    let opt = document.createElement("option");
                    opt.value = sc.id;
                    opt.text = sc.name;

                    if (selectedSubId && sc.id == selectedSubId) {
                        opt.selected = true;
                    }

                    subSelect.appendChild(opt);
                });
            }
        });
}

/* 🔥 AUTO LOAD ON EDIT */
window.addEventListener("DOMContentLoaded", function () {
    const categoryId = document.getElementById("categorySelect").value;
    if (categoryId) {
        loadSubCategories(categoryId);
    }
});
</script>

</body>
</html>
